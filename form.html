<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./form.css">

</head>

<body>

    <div class="formbox">

        <h1>26th Cafe</h1>
        <h2>Create Your Account</h2>
        <p>Register to continue</p>

        <form>

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Email</label>
            <input type="text" id="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number">

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">

            <label>Gender</label>

            <input type="radio" name="gender" class="gender" value="Male">
            Male

            <input type="radio" name="gender" class="gender" value="Female">
            Female

            <input type="radio" name="gender" class="gender" value="Other">
            Other

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <label>Favourite Cafe Item</label>

            <select id="item">
                <option value="">Select an item</option>
                <option value="Coffee">Coffee</option>
                <option value="Tea">Tea</option>
                <option value="Cake">Cake</option>
                <option value="Sandwich">Sandwich</option>
                <option value="Pizza">Pizza</option>
            </select>

            <label>Address</label>

            <textarea id="address" placeholder="Enter your address"></textarea>

            <p>
                <input type="checkbox" id="terms" class="terms">
                I agree to the Terms and Conditions
            </p>

            <button type="button" onclick="register()">REGISTER</button>

            <p id="message"></p>

            <p>
                Already have an account?
                <a href="./login.html">Login</a>
            </p>

        </form>

    </div>

    <script>

        function register() {

            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim().toLowerCase();
            var phone = document.getElementById("phone").value.trim();
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            var dob = document.getElementById("dob").value;
            var item = document.getElementById("item").value;
            var address = document.getElementById("address").value.trim();

            var gender = "";

            var genders = document.getElementsByClassName("gender");

            for (var i = 0; i < genders.length; i++) {

                if (genders[i].checked) {
                    gender = genders[i].value;
                }

            }

            var terms = document.getElementById("terms").checked;

            if (name == "" || email == "" || phone == "" ||
                password == "" || confirmPassword == "" ||
                gender == "" || dob == "" || item == "" ||
                address == "") {

                document.getElementById("message").innerHTML =
                    "Please fill all the details";

            }

            else if (password != confirmPassword) {

                document.getElementById("message").innerHTML =
                    "Passwords do not match";

            }

            else if (terms == false) {

                document.getElementById("message").innerHTML =
                    "Please accept the Terms and Conditions";

            }

            else {

                var customers = JSON.parse(localStorage.getItem("customers")) || [];

                var found = false;

                for (var i = 0; i < customers.length; i++) {

                    if (customers[i].email.toLowerCase() == email) {

                        found = true;

                    }

                }

                if (found == true) {

                    document.getElementById("message").innerHTML =
                        "Email already registered";

                }

                else {

                    var customer = {

                        name: name,
                        email: email,
                        phone: phone,
                        password: password,
                        gender: gender,
                        dob: dob,
                        item: item,
                        address: address

                    };

                    customers.push(customer);

                    localStorage.setItem("customers", JSON.stringify(customers));

                    document.getElementById("message").innerHTML =
                        "Registration Successful!!";

                }

            }

        }

    </script>

</body>

</html>
